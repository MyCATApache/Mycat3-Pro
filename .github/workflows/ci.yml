name: CI

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/docker/sharding-sqlserver/**"
      - "scripts/demo-smoke.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/docker/sharding-sqlserver/**"
      - "scripts/demo-smoke.sh"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-targets

  sqlserver-integration:
    name: SQL Server 2022 Compose integration
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Start SQL Server sharding demo
        working-directory: examples/docker/sharding-sqlserver
        run: docker compose up -d --build --wait
      - name: Run demo assertions
        working-directory: examples/docker/sharding-sqlserver
        run: ./demo.sh
      - name: Collect logs on failure
        if: failure()
        working-directory: examples/docker/sharding-sqlserver
        run: docker compose logs --no-color --tail=300
      - name: Stop services
        if: always()
        working-directory: examples/docker/sharding-sqlserver
        run: docker compose down -v
