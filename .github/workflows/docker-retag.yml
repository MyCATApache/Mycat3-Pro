name: Docker Tag Alias

# 为已存在的 Docker Hub 镜像补一个标签（不重新构建）。
# 典型用途：手动发布产生了 0.3.3，补 v0.3.3 别名；或把 latest 指向某个版本。
# 前置 Secrets 与 Docker Publish 相同：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN。
on:
  workflow_dispatch:
    inputs:
      source:
        description: "源标签（必须已存在）"
        required: true
        default: "0.3.3"
      target:
        description: "目标标签（新建/覆盖）"
        required: true
        default: "v0.3.3"

permissions:
  contents: read

env:
  IMAGE: mycat/mycat3-pro

jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tags
        env:
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ inputs.target }}
        run: |
          for tag in "$SOURCE" "$TARGET"; do
            case "$tag" in
              ""|*[!A-Za-z0-9._-]*)
                echo "::error::非法镜像标签: $tag"
                exit 1
                ;;
            esac
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create alias
        env:
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ inputs.target }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${TARGET}" \
            "${IMAGE}:${SOURCE}"

      - name: Verify
        env:
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ inputs.target }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${SOURCE}"
          docker buildx imagetools inspect "${IMAGE}:${TARGET}"
          docker buildx imagetools inspect "${IMAGE}:latest"
