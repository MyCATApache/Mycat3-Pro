name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # Git for Windows 的 link.exe 会抢占 PATH 中的 MSVC 链接器（ARM64 下必然失败）：
      # 显式定位并固定 Rust 使用的链接器
      - name: Pin MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $hostArch = if ("${{ matrix.arch }}" -eq "arm64") { "HostARM64\ARM64" } else { "Hostx64\x64" }
          $link = Get-ChildItem -Path "$vs\VC\Tools\MSVC\*\bin\$hostArch\link.exe" | Select-Object -First 1
          if (-not $link) { throw "MSVC link.exe not found ($hostArch)" }
          $envName = if ("${{ matrix.target }}" -eq "aarch64-pc-windows-msvc") { "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER" } else { "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER" }
          "$envName=$($link.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "pinned $envName=$($link.FullName)"

      - name: Install aarch64 Linux cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p mycat3-server

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          V="${GITHUB_REF_NAME:-v0.0.0-dev}"
          stage="dist/mycat3-pro-${V}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp README.md LICENSE "$stage"/
          cp -r conf "$stage"/conf
          cp "target/${{ matrix.target }}/release/mycat3-pro" "$stage"/
          tar -czf "dist/mycat3-pro-${V}-${{ matrix.target }}.tar.gz" -C "$stage" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v0.0.0-dev" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $stage = "dist/mycat3-pro-$v-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item README.md,LICENSE $stage
          Copy-Item -Recurse conf "$stage/conf"
          Copy-Item "target/${{ matrix.target }}/release/mycat3-pro.exe" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/mycat3-pro-$v-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mycat3-pro-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Source archive
        run: |
          V="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="mycat3-pro-${V}/" \
            -o "dist/mycat3-pro-${V}-source.tar.gz" HEAD

      - name: Checksums
        run: cd dist && sha256sum mycat3-pro-* > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Mycat3 Pro ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: dist/*
          generate_release_notes: false
