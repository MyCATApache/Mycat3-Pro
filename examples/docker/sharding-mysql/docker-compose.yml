# Mycat3 Pro 分库分表示例（MySQL 后端）
# 启动: docker compose up -d --wait
# 连接: docker compose exec mysql-shard-0 mysql -hmycat3-pro -P8066 -uroot -p123456 -Ddb1
# 一键演示: ./demo.sh
name: mycat3-sharding-mysql

services:
  mysql-shard-0:
    image: mysql:8.0
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: shard_root_pw
      TZ: Asia/Shanghai
    ports:
      - "13317:3306"
    volumes:
      - ./init/shard0.sql:/docker-entrypoint-initdb.d/01-shard0.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  mysql-shard-1:
    image: mysql:8.0
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: shard_root_pw
      TZ: Asia/Shanghai
    ports:
      - "13318:3306"
    volumes:
      - ./init/shard1.sql:/docker-entrypoint-initdb.d/01-shard1.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  mycat3-pro:
    image: mycat/mycat3-pro:latest
    restart: unless-stopped
    ports:
      - "28066:8066"
      - "29066:9066"
    environment:
      MYCAT3_PRO_HOME: /opt/mycat3-pro/conf
      TZ: Asia/Shanghai
    volumes:
      - ./conf:/opt/mycat3-pro/conf
    depends_on:
      mysql-shard-0:
        condition: service_healthy
      mysql-shard-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9066/-/healthy"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 10
