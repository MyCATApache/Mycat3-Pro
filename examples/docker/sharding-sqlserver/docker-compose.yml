# Mycat3 Pro 分库分表示例（SQL Server 2022 后端）
# 启动: docker compose up -d --build --wait（首次构建镜像/SQL Server 初始化较慢）
# 连接: docker compose run --rm -T mysql-client --default-character-set=utf8mb4 \
#         -hmycat3-pro -P8066 -uroot -Ddb1
name: mycat3-sharding-sqlserver

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SqlServer_Demo1!"
      MSSQL_PID: Developer
      TZ: Asia/Shanghai
    ports:
      - "13321:1433"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 30

  # 用 mssql-tools 建库/建 schema/建物理表；成功后 Mycat 才启动。
  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools:latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./init/01-db.sql:/init/01-db.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for i in $$(seq 1 60); do
          if /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'SqlServer_Demo1!' -C -Q "SELECT 1" >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'SqlServer_Demo1!' -C -b -i /init/01-db.sql
    restart: "no"

  mycat3-pro:
    build:
      context: ../../..
      dockerfile: Dockerfile
    image: mycat/mycat3-pro:latest
    restart: unless-stopped
    ports:
      - "38068:8066"
      - "39068:9066"
    environment:
      MYCAT3_PRO_HOME: /opt/mycat3-pro/conf
      TZ: Asia/Shanghai
    volumes:
      - ./conf:/opt/mycat3-pro/conf
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9066/-/healthy"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 10

  mysql-client:
    image: mysql:8.0
    profiles: ["client"]
    entrypoint: ["mysql"]
    environment:
      MYSQL_PWD: "123456"
    depends_on:
      mycat3-pro:
        condition: service_healthy

  sqlcmd-client:
    image: mcr.microsoft.com/mssql-tools:latest
    profiles: ["client"]
    entrypoint: ["/opt/mssql-tools/bin/sqlcmd"]
    depends_on:
      sqlserver:
        condition: service_healthy
